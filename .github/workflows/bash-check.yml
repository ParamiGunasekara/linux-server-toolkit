
name: Bash Script Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash script syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done
